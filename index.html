     - Moves Theme / Go to top / Load more into ONE global control bar (works on all tabs)

<!-- ✅ KEEP: Your Tab 2 hover/visibility normalizer (unchanged) -->
<script>
    (() => {
        const WALL_ID = "t2-wf-wall-inner";
        const BTN_Z = 120; // below modal (250), above image

        const isHoverDevice = matchMedia("(hover: hover) and (pointer: fine)").matches;
        const isTouchDevice = matchMedia("(hover: none)").matches;

        function normalizeFrame(frame) {
            frame.style.position = "relative";
            frame.style.isolation = "isolate";
        }

        function normalizeButton(btn) {
            btn.style.zIndex = String(BTN_Z);
            btn.style.pointerEvents = "auto";
            btn.style.display = "inline-flex";
            btn.style.visibility = "visible";

            if (isHoverDevice) {
                btn.style.opacity = "";
                btn.style.transform = "";
                btn.style.transition = "";
            }

            if (isTouchDevice) {
                btn.style.opacity = "1";
                btn.style.transform = "translateY(0)";
            }
        }

        function fixTab2() {
            const wall = document.getElementById(WALL_ID);
            if (!wall) return;

            wall.querySelectorAll(".wf-frame").forEach(frame => {
                normalizeFrame(frame);
                frame.querySelectorAll(".wf-comment-btn").forEach(normalizeButton);
            });
        }

        function boot() {
            fixTab2();

            const wall = document.getElementById(WALL_ID);
            if (wall) {
                new MutationObserver(() => fixTab2())
                    .observe(wall, { childList: true, subtree: true });
            }

            document.addEventListener("click", (e) => {
                if (e.target?.closest?.('[data-tab="t2"]')) {
                    setTimeout(fixTab2, 0);
                    setTimeout(fixTab2, 150);
                }
            }, true);
        }

        if (document.readyState === "loading") {
            addEventListener("DOMContentLoaded", boot);
        } else {
            boot();
        }
    })();
</script>

<script>
    (() => {
        function setTheme(isDark) {
            document.body.classList.toggle("dark-mode", isDark);
            document.documentElement.classList.toggle("dark-mode", isDark);
            try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch { }
        }

        function applyThemeFromStorage() {
            let saved = null;
            try { saved = localStorage.getItem("theme"); } catch { }
            const isDark = saved === "dark";
            setTheme(isDark);
            syncGlobalThemeUI();
        }

        function syncGlobalThemeUI() {
            const btn = document.getElementById("global-theme-toggle");
            if (!btn) return;
            const isDark = document.body.classList.contains("dark-mode");
            btn.querySelector(".wf-dark-opt")?.classList.toggle("active", isDark);
            btn.querySelector(".wf-light-opt")?.classList.toggle("active", !isDark);
        }

        function boot() {
            // Theme: correct immediately on load
            applyThemeFromStorage();

            // Theme: toggle
            document.getElementById("global-theme-toggle")?.addEventListener("click", (e) => {
                e.preventDefault();
                const next = !document.body.classList.contains("dark-mode");
                setTheme(next);
                syncGlobalThemeUI();
            });

            // ✅ Go to top: restore handler
            document.getElementById("global-go-top")?.addEventListener("click", (e) => {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            // keep theme UI in sync on tab switch
            document.addEventListener("click", (e) => {
                if (e.target?.closest?.(".um-tab")) {
                    setTimeout(syncGlobalThemeUI, 0);
                    setTimeout(syncGlobalThemeUI, 120);
                }
            }, true);
        }

        if (document.readyState === "loading") addEventListener("DOMContentLoaded", boot);
        else boot();
    })();
</script>
